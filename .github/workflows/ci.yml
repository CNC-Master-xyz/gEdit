# Continuous integration: type check, unit tests, frontend build and notices on Linux;
# the bundled Python scripts on the oldest and the newest supported interpreter;
# Rust checks and debug bundles on macOS, Windows and Linux. The release workflow
# (release.yml) calls this one on a version tag, without the debug bundles.
# The runtime harness (tests/runtime) drives native macOS UI; it runs in its own workflow
# (harness.yml, macOS runner, on push to main), not here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole of this workflow on the tagged commit. It builds
  # the release bundles itself, so it asks for the debug bundles to be left out.
  workflow_call:
    inputs:
      skip-bundles:
        description: Leave out the debug bundle jobs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri's Linux build dependencies (WebKitGTK 4.1 and friends)
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # licenses:check reads the crate graph with `cargo metadata --offline`, and the
      # harness source is formatted with rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false

      - run: npm ci
      - name: Fetch crates
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Type check (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Slow tests (wall-clock budgets)
        run: npm run test:slow
      - name: Build frontend
        run: npm run build
      - name: Third-party notices are current
        run: npm run licenses:check
      - name: Versions match
        run: npm run versions:check
      # Each of the checks below is a script or a command of its own, so the same line runs on a
      # developer's machine; `tests/unit/{checkBundle,licenseList,controlBytes}.test.ts` pin
      # what each one has to catch (they run in the unit tests above).
      - name: Bundle has no eval, no Function() and no test hook
        # Direct and indirect forms: `(0, eval)(…)`, `window.eval(…)`, a string timer. Needs build/.
        run: node scripts/check-bundle.mjs build

      - name: Licences are exactly the agreed list
        # Which licences, where `licenses:check` above only proves the notices are current.
        run: node scripts/check-license-list.mjs

      - name: No NUL or control characters in source files
        # Reads the bytes itself: the grep this replaces passed on macOS without looking.
        run: node scripts/check-control-bytes.mjs

      - name: Harness scripts type-check
        # tests/runtime/harness/*.mjs are not in `npm run check` (it reads .js and .ts only).
        run: npx tsc -p tests/runtime/harness

      # tests/runtime/harness/harness.rs is not part of the src-tauri crate, so the
      # `rust` job's `cargo fmt` never sees it.
      - name: Harness Rust is formatted
        run: rustfmt --check --edition 2021 tests/runtime/harness/harness.rs

  # Gate G4. The bundled scripts are standard library only and have to run on the oldest
  # interpreter gEdit supports (3.9, which is what macOS still ships) as well as on a
  # current one, so both ends of the range are checked and nothing in between can drift.
  python:
    name: Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    runs-on: ${{ matrix.os }}
    # The P4a tests (the geometry oracle, the owner-public runs) made the suite ~9.5 min on
    # 3.12 and longer on 3.9 (cancelled at 10 min on 2026-10-16); 30 leaves room on both.
    # Windows starts a process much more slowly than Linux and the suite starts hundreds:
    # not measured yet, so the limit is double.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.9', '3.12']
        include:
          # The scripts run on a user's Windows machine too (`python.rs` has a Windows branch),
          # and the suite had never run there. One interpreter: the newest, which is what a fresh
          # install gives; 3.9, the macOS floor, is covered on Linux above.
          - os: windows-latest
            python: '3.12'
    steps:
      # Git for Windows turns core.autocrlf on, which would give the line-ending-sensitive
      # fixtures CRLF. `.gitattributes` already pins what it can (`tests/fixtures/** -text`,
      # `*.py eol=lf`); this makes the checkout itself take no part in it.
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # No `pip install`: a dependency here would mean an NC programmer cannot run the
      # bundled scripts on a fresh machine.
      - name: Bundled scripts (unittest)
        run: python -m unittest discover -s tests/python -t .

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # generate_context! embeds the frontend, so build/ must exist before cargo runs
      - run: npm ci
      - run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  bundle:
    name: Debug bundle (${{ matrix.os }})
    needs: checks
    if: ${{ !inputs.skip-bundles }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # patchelf is needed for the AppImage
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      # Runs `npm run build` itself (beforeBuildCommand); unsigned debug bundles
      - name: tauri build --debug
        run: npx tauri build --debug

      - uses: actions/upload-artifact@v7
        with:
          name: gedit-debug-${{ matrix.os }}
          path: |
            src-tauri/target/debug/bundle/dmg/*.dmg
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/rpm/*.rpm
            src-tauri/target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

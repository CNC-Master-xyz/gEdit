[package]
name = "gedit"
version = "1.2.0"
description = "A desktop G-code editor for CNC programming (Fanuc, Heidenhain, Okuma, Sinumerik)."
authors = ["Peter <83696476+NC-PB@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/CNC-Master-xyz/gEdit"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique so it doesn't conflict with the bin name (`gedit`).
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's float parser is not correctly rounded and
# a number can come back one ULP away from the one that was sent (M7 integration,
# mergeA). `files_stat` reports `mtimeMs` with a fraction, so a crash-recovery
# snapshot of an untouched file was read back as "the file changed on disk" — the
# safe direction, but it made the warning meaningless by raising it every time.
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
toml = "0.9"
# The configuration zip (P4g, P4.36; docs/planning/phase-4-implementation.md §6.9): exact
# version, no default features. The default set pulls in AES, bzip2, deflate64, LZMA, PPMd,
# xz, zstd and the `time` crate; a configuration zip is written by gEdit with plain deflate,
# and an entry in any other method is refused on import (§6.9 rule 23), so none of them is
# built. `deflate-flate2-zlib-rs` uses the `flate2` + `zlib-rs` pair the build already has
# through Tauri (no new compression crate). The crate's `extract` is never called: gEdit reads
# each entry itself under its own limits (§6.9 rules 22–24). Licence: MIT (checked 2026-10-27).
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

# A job object per script run (`src/scripts/job.rs`): what a script started dies with the
# run on Windows, the way `killpg` does it on Unix. 0.61 is the version Tauri's own
# dependencies already use, so this adds no second copy to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# The macOS termination hook (AD-20, plan M6 P6 item 2). Confined to `src/quit.rs`:
# nothing else in the backend talks to Objective-C, and G8 checks that.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# One running gEdit on Windows and Linux (AD-54, P4f): a second start hands its file paths to
# the first and ends. Not on macOS, where the system keeps one instance of a bundled app and
# sends the files as `RunEvent::Opened`; the plugin's macOS door is a socket in /tmp that any
# local user can write to (plan section 6.8). `~2.4.5`, not `2`: 2.5.x needs tauri 2.12 and
# this build is on 2.11 (a tauri update is its own change); 2.4.x is the newest line that
# resolves against the locked tauri. Licence: Apache-2.0 OR MIT, checked 2026-10-27.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "~2.4.5"
